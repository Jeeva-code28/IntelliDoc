apiVersion: apps/v1
kind: Deployment
metadata:
  name: npn-rag-engine
  namespace: default
  labels:
    app: npn-rag-engine
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: npn-rag-engine
  template:
    metadata:
      labels:
        app: npn-rag-engine
    spec:
      containers:
        - name: npn-rag-engine
          image: project-npn:v2.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: npn-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"
            - name: QDRANT_URL
              value: "http://qdrant-service:6333"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: npn-secrets
                  key: GEMINI_API_KEY
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
