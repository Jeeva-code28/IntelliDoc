version: "3.9"

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
